# ANCIENNE ADRESSE (GitHub Pages) : elle reste ouverte jusqu'à votre accord ; le site principal est sur Cloudflare Pages (carnet-patte.pages.dev, voir DEPLOIEMENT-CLOUDFLARE.md).
# Publie SEULEMENT ce qui sert au site (pas tests/, outils/, README, notes, captures). donnees/ = lieux préparés à l'avance (licence ODbL).
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assembler le site
        # Le même script que Cloudflare Pages (outils/assembler-site.mjs) : seulement ce qui sert au site, avec la version du commit dans sw.js
        run: |
          node outils/assembler-site.mjs --sortie=_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
