<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Démo design 5h — Carnet Patte</title>
<link rel="stylesheet" href="demo/jetons-5h.css">
<style>
  body { margin: 0; background: #E9EBE4; color: var(--cp-texte); font: 14px/20px "Inter", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 20px; background: var(--cp-foret); color: #fff; }
  header h1 { font: 700 15px/20px "Manrope", sans-serif; margin: 0; }
  header p { margin: 0; opacity: .85; font-size: 13px; }
  .barre { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .barre button { font: 500 13px/1 "Inter", sans-serif; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; cursor: pointer; }
  .barre button[aria-pressed="true"] { background: #fff; color: var(--cp-foret); }
  .barre button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .cadres { display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 20px; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: var(--cp-texte-doux); margin-bottom: 6px; }
  iframe { border: 1px solid #C9D3C4; border-radius: 10px; background: var(--cp-fond); display: block; box-shadow: 0 4px 16px rgba(36,61,53,.1); }
  .ordinateur iframe { width: min(1280px, calc(100vw - 40px)); height: 900px; }
  .mobile iframe { width: 390px; height: 844px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Carnet Patte · démonstration du design 5h</h1>
  <p>Proposition non appliquée à l'application · données fictives</p>
  <div class="barre" role="group" aria-label="Écran">
    <button type="button" data-ecran="accueil" aria-pressed="true">Accueil</button>
    <button type="button" data-ecran="rappels" aria-pressed="false">Rappels</button>
    <button type="button" data-ecran="fiche" aria-pressed="false">Fiche animal</button>
  </div>
  <div class="barre" role="group" aria-label="Format">
    <button type="button" data-format="les-deux" aria-pressed="true">Les deux</button>
    <button type="button" data-format="ordinateur" aria-pressed="false">Ordinateur</button>
    <button type="button" data-format="mobile" aria-pressed="false">Mobile</button>
  </div>
</header>
<div class="cadres">
  <figure class="ordinateur"><figcaption>Ordinateur (1280 px)</figcaption><iframe title="Démonstration sur ordinateur" src="demo/ecrans.html#accueil"></iframe></figure>
  <figure class="mobile"><figcaption>Mobile (390 px)</figcaption><iframe title="Démonstration sur mobile" src="demo/ecrans.html#accueil"></iframe></figure>
</div>
<script>
  const cadres = [...document.querySelectorAll('iframe')];
  let ecran = (location.hash || '#accueil').slice(1), format = 'les-deux';
  const maj = () => {
    cadres.forEach((f) => { const u = 'demo/ecrans.html#' + ecran; if (!f.src.endsWith(u)) { f.src = u; f.contentWindow?.location.reload(); } });
    document.querySelector('.ordinateur').hidden = format === 'mobile';
    document.querySelector('.mobile').hidden = format === 'ordinateur';
    document.querySelectorAll('[data-ecran]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.ecran === ecran));
    document.querySelectorAll('[data-format]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.format === format));
  };
  document.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.ecran) ecran = b.dataset.ecran; if (b.dataset.format) format = b.dataset.format; maj(); });
  maj();
</script>
</body>
</html>
